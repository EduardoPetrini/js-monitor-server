<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/icon.png" type="image/x-icon" />
    <title>JS Monitor</title>
    <script src="/js/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js" integrity="sha512-k37wQcV4v2h6jgYf5IUz1MoSKPpDs630XGSmCaCCOXxy2awgAWKHGZWr9nMyGgk3IOxA1NxdkN8r1JHgkUtMoQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/buildEcharts.js"></script>
    <style>
      body {
        background: rgb(32, 32, 32);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: rgb(216, 211, 200);
        fill: rgb(216, 211, 200);
        margin: 0;
        padding: 0;
      }
      header {
        padding: 20px;
        background-color: rgb(45, 45, 45);
        border-bottom: 1px solid rgb(60, 60, 60);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .header-tools {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .container {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .process-container {
        background-color: rgb(40, 40, 40);
        border: 1px solid rgb(60, 60, 60);
        border-radius: 8px;
        margin-bottom: 20px;
        padding: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      .process-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 1px solid rgb(60, 60, 60);
        padding-bottom: 10px;
      }
      .process-header h2 {
        margin: 0;
        font-size: 1.2rem;
      }
      .process-stats span {
        margin-left: 15px;
        font-weight: bold;
        color: #ffa600;
      }

      .charts-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .mem-chart,
      .cpu-chart {
        width: 100%;
        height: 350px;
      }

      .interval-input {
        border-radius: 6px;
        border: 1px solid rgb(100, 100, 100);
        background-color: rgb(32, 32, 32);
        color: white;
        padding: 8px;
        width: 100px;
      }

      .btn-reset {
        margin-left: 15px;
        background-color: rgb(60, 60, 60);
        color: white;
        padding: 8px 15px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-reset:hover {
        background-color: rgb(80, 80, 80);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-tools">
        <h1>JS Resources Monitor</h1>
        <div class="params">
          <label for="interval">Interval (ms): </label>
          <input type="number" name="interval" id="interval" min="100" class="interval-input" value="1000" />
          <button type="button" id="reset" class="btn-reset">Reset Data</button>
        </div>
      </div>
    </header>

    <div class="container">
      <main id="processesWrapper">
        <!-- Processes will be injected here -->
      </main>
    </div>

    <script>
      const processesWrapper = document.getElementById('processesWrapper');
      let processInstances = {}; // pid -> { card, charts }
      let globalIndex = 0;
      let monitorMode = 'local'; // Will be fetched from server
      let consolidatedCharts = null; // For standalone mode

      const socket = io();

      socket.on('update', data => {
        globalIndex++;

        // Data can be object (legacy local) or array (new unified)
        let processes = Array.isArray(data) ? data : [data];

        if (monitorMode === 'standalone') {
          // Standalone mode: use consolidated charts
          handleStandaloneUpdate(processes);
        } else {
          // Local mode: use individual charts per process
          handleLocalUpdate(processes);
        }
      });

      function handleStandaloneUpdate(processes) {
        // Create consolidated charts if they don't exist
        if (!consolidatedCharts) {
          // Clear any existing process instances
          Object.values(processInstances).forEach(inst => {
            if (inst.charts) inst.charts.dispose();
            if (inst.card) inst.card.remove();
          });
          processInstances = {};

          // Create a single container for consolidated charts
          const container = document.createElement('div');
          container.className = 'process-container';
          container.id = 'consolidated-charts';
          container.innerHTML = `
            <div class="process-header">
              <h2>All Node.js Processes</h2>
              <div class="process-stats">
                <span class="stat-count">Processes: ${processes.length}</span>
              </div>
            </div>
            <div class="charts-container">
              <div class="mem-chart"></div>
              <div class="cpu-chart"></div>
            </div>
          `;
          processesWrapper.appendChild(container);

          const memEl = container.querySelector('.mem-chart');
          const cpuEl = container.querySelector('.cpu-chart');
          consolidatedCharts = buildConsolidatedCharts(memEl, cpuEl);
        }

        // Update process count
        const countEl = document.querySelector('#consolidated-charts .stat-count');
        if (countEl) {
          countEl.innerText = `Processes: ${processes.length}`;
        }

        // Update consolidated charts with all processes
        consolidatedCharts.update(processes, globalIndex);
      }

      function handleLocalUpdate(processes) {
        const currentPids = new Set();

        processes.forEach(proc => {
          const pid = proc.pid || 'local';
          currentPids.add(pid);

          if (!processInstances[pid]) {
            const card = document.createElement('div');
            card.className = 'process-container';
            card.id = `proc-${pid}`;
            card.innerHTML = `
              <div class="process-header">
                <h2>${proc.name || 'Unknown Process'} <small>(PID: ${pid})</small></h2>
                <div class="process-stats">
                  <span class="stat-cpu">CPU: ...</span>
                  <span class="stat-mem">Mem: ...</span>
                </div>
              </div>
              <div class="charts-container">
                <div class="mem-chart"></div>
                <div class="cpu-chart"></div>
              </div>
            `;
            processesWrapper.appendChild(card);

            // Initialize charts
            const memEl = card.querySelector('.mem-chart');
            const cpuEl = card.querySelector('.cpu-chart');
            const charts = buildProcessCharts(memEl, cpuEl);

            processInstances[pid] = { card, charts };
          }

          const instance = processInstances[pid];

          // Update Stats Text
          const cpuVal = typeof proc.mainCpu === 'number' ? proc.mainCpu.toFixed(2) : proc.mainCpu;
          instance.card.querySelector('.stat-cpu').innerText = `CPU: ${cpuVal}`;
          instance.card.querySelector('.stat-mem').innerText = `Mem: ${proc.mainMemory} MB`;

          // Update Charts
          instance.charts.update(proc, globalIndex);
        });

        // Cleanup removed processes
        Object.keys(processInstances).forEach(pidStr => {
          const key = currentPids.has(Number(pidStr)) ? Number(pidStr) : pidStr;
          if (!currentPids.has(key)) {
            processInstances[pidStr].charts.dispose();
            processInstances[pidStr].card.remove();
            delete processInstances[pidStr];
          }
        });
      }

      async function setServerInterval(interval) {
        try {
          await fetch('/interval', {
            headers: { 'Content-type': 'application/json' },
            method: 'POST',
            body: JSON.stringify({ interval }),
          });
        } catch (e) {
          console.error(e);
        }
      }

      async function fetchMode() {
        try {
          const response = await fetch('/mode');
          const data = await response.json();
          monitorMode = data.mode || 'local';
          console.log('Monitor mode:', monitorMode);
        } catch (e) {
          console.error('Failed to fetch mode:', e);
          monitorMode = 'local'; // Default to local
        }
      }

      window.onload = async function () {
        // Fetch the monitor mode first
        await fetchMode();

        const input = document.getElementById('interval');

        const updateInterval = async () => {
          let value = input.value;
          if (value < 100) {
            value = 100;
            input.value = value;
          }
          window.localStorage.setItem('interval', value);
          await setServerInterval(value);
        };

        input.addEventListener('keypress', async event => {
          if (event.key === 'Enter') {
            await updateInterval();
          }
        });

        input.addEventListener('blur', updateInterval);

        const reset = document.getElementById('reset');
        reset.addEventListener('click', () => {
          if (monitorMode === 'standalone' && consolidatedCharts) {
            consolidatedCharts.reset();
          } else {
            Object.values(processInstances).forEach(inst => inst.charts.reset());
          }
          globalIndex = 0;
        });

        let interval = window.localStorage.getItem('interval');
        if (!interval || Number(interval) < 100) {
          interval = 1000;
        }
        input.value = interval;
        await setServerInterval(interval);
      };
    </script>
  </body>
</html>
