<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/icon.png" type="image/x-icon" />
    <title>JS Monitor</title>
    <script src="/js/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js" integrity="sha512-k37wQcV4v2h6jgYf5IUz1MoSKPpDs630XGSmCaCCOXxy2awgAWKHGZWr9nMyGgk3IOxA1NxdkN8r1JHgkUtMoQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="/js/buildEcharts.js"></script>
    <style>
      body {
        background: rgb(32, 32, 32);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: rgb(216, 211, 200);
        fill: rgb(216, 211, 200);
        margin: 0;
        padding: 0;
      }
      header {
        padding: 20px;
        background-color: rgb(45, 45, 45);
        border-bottom: 1px solid rgb(60, 60, 60);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .header-tools {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }

      .container {
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .process-container {
        background-color: rgb(40, 40, 40);
        border: 1px solid rgb(60, 60, 60);
        border-radius: 8px;
        margin-bottom: 20px;
        padding: 15px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      .process-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        border-bottom: 1px solid rgb(60, 60, 60);
        padding-bottom: 10px;
      }
      .process-header h2 {
        margin: 0;
        font-size: 1.2rem;
      }
      .process-stats span {
        margin-left: 15px;
        font-weight: bold;
        color: #ffa600;
      }

      .charts-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .mem-chart,
      .cpu-chart {
        width: 100%;
        height: 350px;
      }

      .interval-input {
        border-radius: 6px;
        border: 1px solid rgb(100, 100, 100);
        background-color: rgb(32, 32, 32);
        color: white;
        padding: 8px;
        width: 100px;
      }

      .btn-reset {
        margin-left: 15px;
        background-color: rgb(60, 60, 60);
        color: white;
        padding: 8px 15px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-reset:hover {
        background-color: rgb(80, 80, 80);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-tools">
        <h1>JS Resources Monitor</h1>
        <div class="params">
          <label for="interval">Interval (ms): </label>
          <input type="number" name="interval" id="interval" min="100" class="interval-input" value="1000" />
          <button type="button" id="reset" class="btn-reset">Reset Data</button>
        </div>
      </div>
    </header>

    <div class="container">
      <main id="processesWrapper">
        <!-- Processes will be injected here -->
      </main>
    </div>

    <script>
      const processesWrapper = document.getElementById('processesWrapper');
      const processInstances = {}; // pid -> { card, charts }
      let globalIndex = 0;

      const socket = io();

      socket.on('update', data => {
        globalIndex++;

        // Data can be object (legacy local) or array (new unified)
        // Adapt if it's a single object (legacy support or transitional)
        let processes = Array.isArray(data) ? data : [data];

        // Legacy fix: if single object doesn't have pid, mock it?
        // But our backend now sends array. So we assume array.

        const currentPids = new Set();

        processes.forEach(proc => {
          // proc might be just stats or have wrapper.
          // Our backend sends: { pid, name, cpu, memory, mainCpu, mainMemory, ... }
          // Some might lack pid if really legacy, but we ensured pid in backend.

          const pid = proc.pid || 'local';
          currentPids.add(pid);

          if (!processInstances[pid]) {
            const card = document.createElement('div');
            card.className = 'process-container';
            card.id = `proc-${pid}`;
            card.innerHTML = `
                    <div class="process-header">
                        <h2>${proc.name || 'Unknown Process'} <small>(PID: ${pid})</small></h2>
                        <div class="process-stats">
                           <span class="stat-cpu">CPU: ...</span>
                           <span class="stat-mem">Mem: ...</span>
                        </div>
                    </div>
                    <div class="charts-container">
                        <div class="mem-chart"></div>
                        <div class="cpu-chart"></div>
                    </div>
                `;
            processesWrapper.appendChild(card);

            // Initialize charts
            const memEl = card.querySelector('.mem-chart');
            const cpuEl = card.querySelector('.cpu-chart');
            const charts = buildProcessCharts(memEl, cpuEl);

            processInstances[pid] = { card, charts };
          }

          const instance = processInstances[pid];

          // Update Stats Text
          // Logic for CPU unit display?
          // If it's percentage (standalone), show %. If huge number (local legacy microseconds), maybe div by 1000?
          // In backend we moved local to use 'mainCpu' = diff.user.
          // Let's just display what we get.
          const cpuVal = typeof proc.mainCpu === 'number' ? proc.mainCpu.toFixed(2) : proc.mainCpu;
          instance.card.querySelector('.stat-cpu').innerText = `CPU: ${cpuVal}`;
          instance.card.querySelector('.stat-mem').innerText = `Mem: ${proc.mainMemory} MB`;

          // Update Charts
          // buildEcharts expects { memory, cpu } object.
          instance.charts.update(proc, globalIndex);
        });

        // Cleanup removed processes
        Object.keys(processInstances).forEach(pidStr => {
          // If pidStr is 'local' (legacy), keep it?
          // 'local' vs number.
          // currentPids has whatever we processed.
          // Compare as strings to be safe or parse int.
          // pid from backend is number or string. pidStr is string.
          // If !currentPids.has(Number(pidStr)) AND !currentPids.has(pidStr)

          const key = currentPids.has(Number(pidStr)) ? Number(pidStr) : pidStr;
          if (!currentPids.has(key)) {
            processInstances[pidStr].charts.dispose();
            processInstances[pidStr].card.remove();
            delete processInstances[pidStr];
          }
        });
      });

      async function setServerInterval(interval) {
        try {
          await fetch('/interval', {
            headers: { 'Content-type': 'application/json' },
            method: 'POST',
            body: JSON.stringify({ interval }),
          });
        } catch (e) {
          console.error(e);
        }
      }

      window.onload = async function () {
        const input = document.getElementById('interval');

        const updateInterval = async () => {
          let value = input.value;
          if (value < 100) {
            value = 100;
            input.value = value;
          }
          window.localStorage.setItem('interval', value);
          await setServerInterval(value);
        };

        input.addEventListener('keypress', async event => {
          if (event.key === 'Enter') {
            await updateInterval();
          }
        });

        // Also update on blur?
        input.addEventListener('blur', updateInterval);

        const reset = document.getElementById('reset');
        reset.addEventListener('click', () => {
          Object.values(processInstances).forEach(inst => inst.charts.reset());
          globalIndex = 0;
        });

        let interval = window.localStorage.getItem('interval');
        if (!interval || Number(interval) < 100) {
          interval = 1000;
        }
        input.value = interval;
        await setServerInterval(interval);
      };
    </script>
  </body>
</html>
